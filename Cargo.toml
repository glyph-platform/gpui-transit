[package]
name = "gpui-transit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Production-grade, declarative, hierarchical MVI navigation framework for GPUI"
repository = "https://github.com/glyph-platform/gpui-transit"
readme = "README.md"
keywords = ["gpui", "navigation", "router", "mvi", "desktop"]
categories = ["gui"]

[workspace]
members = [
    ".",
    "macros",
]

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.10" }
lru = "0.18"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = "0.1"
gpui-transit-macros = { path = "macros", version = "0.1.0", optional = true }

[features]
default = ["derive", "serde"]
derive = ["dep:gpui-transit-macros"]
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
gpui = { package = "gpui-fast", version = "0.1.10", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
